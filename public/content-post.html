  <script>
    window.renderArticleOutline = function () {
      const content = document.getElementById("postContent");
      const outline = document.getElementById("articleOutline");
      if (!content || !outline) return;
      const seen = new Set();
      const headings = Array.from(content.querySelectorAll("h2, h3")).filter((heading) => {
        const label = String(heading.textContent || "").replace(/\s+/g, " ").trim();
        return Boolean(label);
      }).map((heading, index) => {
        const label = String(heading.textContent || "").replace(/\s+/g, " ").trim();
        let id = heading.id || `article-section-${index + 1}-${label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")}`;
        const originalId = id;
        let suffix = 2;
        while (seen.has(id) || (document.getElementById(id) && document.getElementById(id) !== heading)) id = `${originalId}-${suffix++}`;
        seen.add(id);
        heading.id = id;
        return { id, label };
      });
      const pageUrl = `${window.location.pathname}${window.location.search}`;
      outline.innerHTML = headings.length
        ? headings.map(({ id, label }) => `<a href="${pageUrl}#${encodeURIComponent(id)}" data-scroll-target="${id}">${label.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</a>`).join("")
        : '<span class="outline-empty">No section headings in this article yet.</span>';
      outline.querySelectorAll("a[data-scroll-target]").forEach((link) => link.addEventListener("click", (event) => {
        event.preventDefault();
        const id = link.dataset.scrollTarget;
        const target = id ? document.getElementById(id) : null;
        if (!target) return;
        window.history.replaceState(null, "", `${pageUrl}#${encodeURIComponent(id)}`);
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }));
    };
    window.renderArticleOutline();
  </script>

  <script type="module">
    import { collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { db } from "./dashboard-common.js";
    import { escapeHtml as esc, formatInline } from "./text-format.js";
    import { resolveEditorialAssignments } from "./editorial-contributors.js";

    const params = new URLSearchParams(window.location.search);
    const TYPE_MAP = {
      "prop-news": { collection: "propNewsPosts", backHref: "/prop-news", backLabel: "Prop News" },
      "trading-guides": { collection: "tradingGuidesPosts", backHref: "/trading-guides", backLabel: "Trading Guides" },
      "funding-strategies": { collection: "fundingStrategiesPosts", backHref: "/funding-strategies", backLabel: "Funding Strategies" },
      "trading-psychology": { collection: "tradingPsychologyPosts", backHref: "/trading-psychology", backLabel: "Trading Psychology" },
      "beginner-tutorials": { collection: "beginnerTutorialsPosts", backHref: "/beginner-tutorials", backLabel: "Beginner Tutorials" }
    };
    const routeParts = String(window.location.pathname || "").split("/").filter(Boolean);
    const routeHead = String(routeParts[0] || "").trim().toLowerCase();
    const routeSlug = String(routeParts[1] || "").trim().toLowerCase();
    const ROUTE_TYPE_MAP = {
      "blog": "prop-news",
      "news": "prop-news",
      "trading-guides": "trading-guides",
      "funding-strategies": "funding-strategies",
      "trading-psychology": "trading-psychology",
      "beginner-tutorials": "beginner-tutorials"
    };
    const routeType = ROUTE_TYPE_MAP[routeHead] || "";
    const postType = String(routeType || params.get("type") || "prop-news").trim().toLowerCase();
    const slug = String(routeSlug || params.get("slug") || "").trim();
    const typeCfg = TYPE_MAP[postType] || TYPE_MAP["prop-news"];
    const backLink = document.getElementById("postBackLink");
    if (backLink) {
      backLink.href = typeCfg.backHref;
      backLink.textContent = `← Back to ${typeCfg.backLabel}`;
    }

    function postUrl(type, rowSlug) {
      const s = encodeURIComponent(String(rowSlug || "").trim());
      const base = type === "prop-news" ? "news" : type;
      return `https://www.rankmyprop.in/${base}/${s}`;
    }

    function localPostHref(type, rowSlug) {
      const s = encodeURIComponent(String(rowSlug || "").trim());
      const base = type === "prop-news" ? "news" : type;
      return `/${base}/${s}`;
    }

    function sorted(rows){
      return rows.sort((a,b)=>(b.updatedAt?.seconds||b.createdAt?.seconds||0)-(a.updatedAt?.seconds||a.createdAt?.seconds||0));
    }

    function cleanText(v = "") {
      return String(v || "").replace(/\s+/g, " ").trim();
    }

    function shortDesc(v = "", max = 170) {
      const s = cleanText(v);
      if (!s) return "";
      return s.length <= max ? s : `${s.slice(0, Math.max(0, max - 1)).trim()}…`;
    }

    function setJsonLd(id, data) {
      const el = document.getElementById(id);
      if (el) el.textContent = JSON.stringify(data);
    }

    function shortText(v = "", max = 220) {
      const s = cleanText(v);
      if (!s) return "";
      if (s.length <= max) return s;
      return `${s.slice(0, Math.max(0, max - 1)).trim()}…`;
    }

    function getContentBlocks(post) {
      return String(post?.content || post?.excerpt || "No content available.")
        .split(/\n{2,}/)
        .map((p)=>p.trim())
        .filter(Boolean)
        .filter((p) => !/This post was migrated from the legacy article page/i.test(p) && !/You can fully edit this content from Prop News CMS/i.test(p));
    }

    function getNumberedContentBlocks(post, fallbackBlocks = []) {
      const numberedBlocks = [];
      for (let i = 1; i <= 6; i += 1) {
        const text = String(post?.[`paragraph${i}`] || "").trim();
        if (text) numberedBlocks.push({ text, number: i });
      }
      return numberedBlocks.length
        ? numberedBlocks
        : fallbackBlocks.map((text, index) => ({ text, number: index + 1 }));
    }

    function editorialEntries(post) {
      const assignments = resolveEditorialAssignments(post || {}, postType);
      const entries = [];
      if (assignments.reviewed) entries.push({ role: "Reviewed By", contributor: assignments.reviewed });
      if (assignments.verified) entries.push({ role: "Verified By", contributor: assignments.verified });
      return entries;
    }

    function renderEditorialTrust(entries = []) {
      const trust = document.getElementById("editorialTrust");
      if (!trust) return;
      trust.innerHTML = entries.map(({ role, contributor }) => `<div class="editorial-trust-item"><span>${esc(role)}</span><strong>${esc(contributor.name)}</strong></div>`).join("");
      trust.classList.toggle("is-ready", entries.length > 0);
    }

    function editorialProfileHtml(entries = []) {
      const people = new Map();
      entries.forEach(({ role, contributor }) => {
        const current = people.get(contributor.id);
        if (current) current.roles.push(role);
        else people.set(contributor.id, { contributor, roles: [role] });
      });
      if (!people.size) return "";
      const cards = Array.from(people.values()).map(({ contributor, roles }) => `
        <section class="editorial-profile-card" aria-label="${esc(contributor.name)} editorial profile">
          <div class="editorial-profile-image"><img loading="lazy" decoding="async" src="${esc(contributor.image)}" alt="${esc(`${contributor.name}, ${contributor.role}`)}" width="600" height="750"></div>
          <div class="editorial-profile-copy">
            <div class="editorial-profile-kicker">${esc(roles.join(" · "))}</div>
            <h2 class="editorial-profile-name">${esc(contributor.name)}</h2>
            <div class="editorial-profile-role">${esc(contributor.role)}</div>
            <div class="editorial-profile-expertise">${contributor.expertise.map((area) => `<span>${esc(area)}</span>`).join("")}</div>
            <p class="editorial-profile-bio">${esc(contributor.bio)}</p>
          </div>
        </section>`).join("");
      return `<div class="editorial-profile-list" aria-label="Editorial contributors">${cards}</div>`;
    }

    function renderPost(post){
      const title = post?.title || "Article not found";
      const fullTitle = `${title} | Rank My Prop`;
      const blocks = getContentBlocks(post);
      const desc = shortDesc(post?.seoDescription || post?.excerpt || blocks[0] || "Read latest prop firm article on Rank My Prop.");
      const canon = postUrl(postType, post?.slug || "");
      document.title = fullTitle;
      document.getElementById("docTitle").textContent = fullTitle;
      document.getElementById("metaDesc").setAttribute("content", desc);
      document.getElementById("canonicalLink").setAttribute("href", canon);
      [["ogTitle", fullTitle], ["ogDesc", desc], ["ogUrl", canon], ["twitterTitle", fullTitle], ["twitterDesc", desc]].forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute("content", value);
      });
      setJsonLd("articleSchema", {
        "@context": "https://schema.org",
        "@type": "Article",
        headline: cleanText(title),
        description: desc,
        mainEntityOfPage: canon,
        author: { "@type": "Person", name: cleanText(post?.author || "Rank My Prop Editorial") },
        contributor: editorialEntries(post).map(({ role, contributor }) => ({ "@type": "Person", name: contributor.name, jobTitle: contributor.role, description: contributor.bio, image: `https://www.rankmyprop.in${contributor.image}`, roleName: role })),
        publisher: { "@type": "Organization", name: "Rank My Prop", logo: { "@type": "ImageObject", url: "https://www.rankmyprop.in/assets/Rank%20My%20Prop%20Logo%201.webp" } },
        image: cleanText(post?.coverImage || post?.thumbUrl || post?.thumbnailUrl || post?.thumbnail || "https://www.rankmyprop.in/assets/Rank%20My%20Prop%20Logo%201.webp"),
        datePublished: cleanText(post?.createdAt?.toDate?.()?.toISOString?.() || post?.publishDate || ""),
        dateModified: cleanText(post?.updatedAt?.toDate?.()?.toISOString?.() || post?.publishDate || "")
      });
      setJsonLd("articleBreadcrumbSchema", {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        itemListElement: [
          { "@type": "ListItem", position: 1, name: "Home", item: "https://www.rankmyprop.in/" },
          { "@type": "ListItem", position: 2, name: typeCfg.backLabel, item: `https://www.rankmyprop.in${typeCfg.backHref}` },
          { "@type": "ListItem", position: 3, name: cleanText(title), item: canon }
        ]
      });
      document.getElementById("postTitle").textContent = title;

      const minutes = Math.max(1, Number(post?.readTime||6));
      document.getElementById('postMin').textContent = `${minutes} min`;

      const author = String(post?.author || 'Rank My Prop Editorial');
      document.getElementById('authorMeta').textContent = `${author}`;
      const initial = (author||'R').trim().slice(0,1).toUpperCase();
      const avatar = document.getElementById('authorAvatar'); if(avatar) avatar.textContent = initial;
      const editorial = editorialEntries(post);
      renderEditorialTrust(editorial);


      const cover = document.getElementById("postCover");
      const coverPh = document.getElementById('postCoverPh');
      const src = String(post?.coverImage || post?.thumbUrl || post?.thumbnailUrl || post?.thumbnail || "").trim();
      if (src) {
        cover.src = src;
        cover.hidden = false;
        if(coverPh) coverPh.style.display = 'none';
      } else {
        cover.removeAttribute("src");
        cover.hidden = true;
        if(coverPh) coverPh.style.display = 'grid';
      }

      // build HTML blocks and insert tables (if any)
      const numberedBlocks = getNumberedContentBlocks(post, blocks);
      const blocksHtml = numberedBlocks.map(({ text, number }, i)=>{
        const subheading = cleanText(post?.[`subheading${number}`] || "");
        const subheadingHtml = subheading ? `<h3>${esc(subheading)}</h3>` : "";
        const paragraphImage = String(post?.[`paragraphImage${number}`] || "").trim();
        const imageHtml = paragraphImage ? `<figure class="paragraph-image"><img loading="lazy" decoding="async" src="${esc(paragraphImage)}" alt="${esc(`${title} — paragraph ${number}`)}"></figure>` : "";
        return { html:`${subheadingHtml}<p class="${i===0?'lead':''}">${formatInline(text)}</p>${imageHtml}` };
      });

      if (Array.isArray(post?.tables) && post.tables.length) {
        post.tables.forEach((t)=>{
          const after = Number(t.afterParagraph || 0);
          const insertAt = Math.min(Math.max(0, after), blocksHtml.length);
          const cols = String(t.columns || '').split('|').map(c=>c.trim()).filter(Boolean);
          const rows = Array.isArray(t.rows) ? t.rows : String(t.rows || '').split(/\n/).map(r=>r.trim()).filter(Boolean);

          const header = cols.map(c=>`<th style="text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,.04)">${esc(c)}</th>`).join('');
          const body = rows.map(row=>{
            const cells = row.split('|').map(cell=>formatInline(cell.trim())).map(c=>`<td style="padding:8px;border-bottom:1px solid rgba(255,255,255,.03)">${c}</td>`).join('');
            return `<tr>${cells}</tr>`;
          }).join('');

          const tableHtml = `<div class="article-table" style="margin:18px 0;padding:12px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03)"><h4 style="margin:0 0 8px">${esc(t.title||'Table')}</h4><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table></div></div>`;
          blocksHtml.splice(insertAt, 0, { html: tableHtml });
        });
      }

      const html = `${blocksHtml.map(b=>b.html).join('')}${editorialProfileHtml(editorial)}`;
      document.getElementById("postContent").innerHTML = html;
      window.renderArticleOutline?.();
      return blocks;
    }

    function renderSide(posts, currentSlug){
      const recent = posts.filter((p)=>p.slug!==currentSlug).slice(0,6);

      const keepGrid = document.getElementById("continueGrid");
      if (!keepGrid) return;
      const keep = recent.slice(0,3).map((p)=>{
        const img = String(p.coverImage || p.thumbUrl || p.thumbnailUrl || p.thumbnail || "").trim();
        return `<a class="continue-card${img ? "" : " no-img"}" href="${localPostHref(postType, p.slug)}">${img ? `<img fetchpriority="low" loading="lazy" decoding="async" src="${esc(img)}" alt="${esc(p.title)}">` : ""}<div>${esc(p.title)}</div></a>`;
      }).join('');
      keepGrid.innerHTML = keep || `<a class="continue-card" href="${typeCfg.backHref}"><div>Explore all posts</div></a>`;
    }

    async function loadSidebarBanner(){
      const banner = document.getElementById("blogSidebarBanner");
      if (!banner) return;
      try {
        const snap = await getDoc(doc(db, "siteSettings", "blogSidebarBanner"));
        const settings = snap.exists() ? (snap.data() || {}) : {};
        const imageUrl = String(settings.imageUrl || "").trim();
        if (!imageUrl) return;
        const targetUrl = String(settings.targetUrl || "/listedprop").trim() || "/listedprop";
        const alt = String(settings.alt || "Explore Rank My Prop").trim() || "Explore Rank My Prop";
        banner.href = targetUrl;
        banner.innerHTML = `<img loading="lazy" decoding="async" src="${esc(imageUrl)}" alt="${esc(alt)}">`;
        banner.classList.add("is-ready");
      } catch (_) {
        // The article remains fully usable when the optional banner setting is unavailable.
      }
    }

    async function init(){
      const readPosts = async (collectionName) => {
        const snap = await getDocs(collection(db, collectionName));
        const rows = [];
        snap.forEach((d)=>{
          const v = d.data() || {};
          if (String(v.status||"draft") !== "published") return;
          if (v.active === false) return;
          rows.push({ id:d.id, ...v, slug:String(v.slug||d.id) });
        });
        return rows;
      };

      let rows = [];
      try {
        rows = await readPosts(typeCfg.collection);
      } catch (_) {
        rows = [];
      }
      if (!rows.length && typeCfg.collection !== "propNewsPosts") {
        try {
          rows = await readPosts("propNewsPosts");
        } catch (_) {
          rows = [];
        }
      }

      const posts = sorted(rows);
      const post = posts.find((p)=>p.slug===slug) || posts[0] || null;
      const blocks = renderPost(post); 
      renderSide(posts, post?.slug || "");
    }

    init();
    loadSidebarBanner();

    // hide cover when requested and support hash scrolling
    (function(){
      try{
        const params = new URLSearchParams(window.location.search);
        if(params.get('hideThumb') === '1'){
          const cover = document.getElementById('postCover');
          if(cover) cover.hidden = true;
        }
      }catch(e){}
      if(window.location.hash){
        const id = window.location.hash.replace('#','');
        const el = document.getElementById(id);
        if(el) setTimeout(()=> el.scrollIntoView({behavior:'smooth', block:'center'}), 180);
      }
    })();

    const featuresBtn=document.getElementById('featuresBtn');const featuresWrapper=featuresBtn?.parentElement;
    featuresBtn?.addEventListener('click',e=>{e.stopPropagation();featuresWrapper.classList.toggle('open')});
    document.addEventListener('click',()=>featuresWrapper?.classList.remove('open'));
    const hamburger=document.getElementById('hamburger');const mobileMenu=document.getElementById('mobileMenu');
    hamburger?.addEventListener('click',e=>{e.stopPropagation();mobileMenu.classList.toggle('open')});
    document.addEventListener('click',()=>mobileMenu?.classList.remove('open'));
  </script>
  <script type="module" src="rmp-nav.js"></script>
  <script type="module" src="site-animations.js"></script>
<script type="module" src="/site-performance.js"></script>
</body>
