<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07060d" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Broker Research Coming Soon | Rank My Prop</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(123,83,238,.24),transparent 30rem),#05040b;color:#f6f3ff;font-family:"Plus Jakarta Sans",sans-serif}
    .coming-card{position:relative;width:min(720px,100%);overflow:hidden;padding:64px 48px;border:1px solid rgba(155,129,232,.3);border-radius:28px;background:linear-gradient(145deg,rgba(28,19,47,.94),rgba(9,7,16,.98));text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.5)}
    .coming-card::before{position:absolute;inset:-45% 20% auto;height:300px;border-radius:50%;background:rgba(133,84,235,.2);filter:blur(60px);content:""}
    .mark{position:relative;display:grid;width:70px;height:70px;margin:0 auto 22px;place-items:center;border:1px solid rgba(185,164,255,.36);border-radius:20px;background:linear-gradient(135deg,rgba(118,83,236,.92),rgba(163,106,255,.92));box-shadow:0 18px 42px rgba(103,66,212,.32)}
    .mark img{display:block;width:58px;height:58px;object-fit:contain}
    .eyebrow{position:relative;display:block;margin-top:2px;color:#aa96ff;font-size:11px;font-weight:800;letter-spacing:.18em}
    h1{position:relative;display:block;margin:16px 0 0;font-size:clamp(42px,7vw,74px);font-weight:600;line-height:1;letter-spacing:-.055em}
    p{position:relative;max-width:570px;margin:20px auto 0;color:#aaa2b5;font-size:15px;line-height:1.7}
    .actions{position:relative;display:flex;justify-content:center;gap:10px;margin-top:30px}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 22px;border-radius:12px;color:#fff;font-size:13px;font-weight:800;text-decoration:none}
    .primary{background:linear-gradient(135deg,#7653ec,#9966f5);box-shadow:0 15px 34px rgba(101,63,207,.3)}
    .secondary{border:1px solid rgba(173,151,236,.24);background:rgba(255,255,255,.035)}
    .countdown{position:relative;margin-top:25px;color:#7f7789;font-size:12px}.countdown strong{color:#d4c8ff;font-size:14px}
    .progress{position:relative;width:min(340px,80%);height:4px;margin:12px auto 0;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.07)}.progress span{display:block;width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,#7653ec,#b879ff);animation:redirect-progress 5s linear forwards}
    @keyframes redirect-progress{to{transform:scaleX(0)}}
    @media(max-width:560px){.coming-card{padding:48px 20px;border-radius:22px}.actions{flex-direction:column}.actions a{width:100%}}
    @media(prefers-reduced-motion:reduce){.progress span{animation:none}}
  </style>
<script id="rmp-ssr-bootstrap">window.__RMP_SSR_BOOTSTRAP={"id":"page-broker-coming-soon","heading":"Coming Soon","paragraph":"","seoTitle":"Broker Research Coming Soon | Rank My Prop","seoDescription":"","canonical":"https://www.rankmyprop.in/broker-coming-soon","robots":"index, follow, max-image-preview:large, max-snippet:-1","__stableSsrHero":true};</script>
<script defer src="/route-content-runtime.js"></script>
</head>
<body data-rmp-no-global-footer>
  <main class="coming-card">
    <div class="mark" aria-hidden="true"><img src="/assets/rankmyprop-header-logo.png" alt=""></div>
    <span class="eyebrow">BROKER RESEARCH</span>
    <h1>Coming Soon</h1>
    <p>Our broker comparison experience is being prepared. For now, explore verified prop firms, trader reviews, rules and current offers.</p>
    <div class="actions">
      <a class="primary" href="/listedprop">Explore Prop Firms</a>
      <a class="secondary" href="/">Back to Home</a>
    </div>
    <div class="countdown" aria-live="polite">Redirecting to home in <strong id="countdown">5</strong> seconds</div>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
  <script>
    let seconds = 5;
    const counter = document.getElementById("countdown");
    const timer = window.setInterval(() => {
      seconds -= 1;
      counter.textContent = String(Math.max(0, seconds));
      if (seconds <= 0) {
        window.clearInterval(timer);
        window.location.replace("/");
      }
    }, 1000);
  </script>
  <script type="module" src="/site-performance.js"></script>
</body>
</html>
