<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05040b">
  <title>Announcements | Rank My Prop</title>
  <meta name="description" content="Read the latest RankMyProp platform announcements, offer updates and newly listed prop firm news.">
  <meta name="robots" content="index, follow"><link rel="canonical" href="https://www.rankmyprop.in/announcements">
  <link rel="icon" href="/favicon-48x48.png"><link rel="manifest" href="/site.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link id="rmpHomeHeaderStyles" rel="stylesheet" href="/home-header-shell.css"><link id="rmpHomeFooterStyles" rel="stylesheet" href="/home-footer-shell.css"><link rel="stylesheet" href="/global-footer.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#05040b;color:#f6f3ff;font-family:"Plus Jakarta Sans",sans-serif}.ann-page{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:150px 0 90px}.ann-hero{text-align:center;max-width:820px;margin:0 auto 45px}.ann-hero span{color:#a68cff;font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.ann-hero h1{font-size:clamp(38px,6vw,72px);line-height:1.05;margin:12px 0 16px;background:linear-gradient(90deg,#fff,#9474ff);-webkit-background-clip:text;color:transparent}.ann-hero p{color:#aaa4bb;line-height:1.7}.ann-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.ann-card{padding:25px;border:1px solid rgba(149,121,255,.22);border-radius:18px;background:linear-gradient(145deg,#11101b,#0b0913)}.ann-tag{display:inline-flex;padding:6px 10px;border-radius:99px;background:#24184b;color:#c9baff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.ann-card h2{font-size:21px;line-height:1.35;margin:14px 0 9px}.ann-card p{color:#b8b2c6;line-height:1.65;margin:0}.ann-date{display:block;color:#777184;font-size:12px;margin-top:18px}.ann-empty{grid-column:1/-1;text-align:center;padding:50px;border:1px dashed rgba(149,121,255,.25);border-radius:18px;color:#aaa4bb}@media(max-width:680px){.ann-page{padding-top:120px}.ann-grid{grid-template-columns:1fr}.ann-card{padding:20px}}
  </style>
<script id="rmp-ssr-bootstrap">window.__RMP_SSR_BOOTSTRAP={"id":"page-announcements","heading":"Latest Announcements","paragraph":"Read the latest RankMyProp platform announcements, offer updates and newly listed prop firm news.","seoTitle":"Announcements | Rank My Prop","seoDescription":"Read the latest RankMyProp platform announcements, offer updates and newly listed prop firm news.","canonical":"https://www.rankmyprop.in/announcements","robots":"index, follow, max-image-preview:large, max-snippet:-1","__stableSsrHero":true};</script>
<script defer src="/route-content-runtime.js"></script>
</head>
<body>
  <main class="ann-page"><header class="ann-hero"><span>RankMyProp updates</span><h1>Latest Announcements</h1><p>Official platform news, newly listed firms and important offer updates from RankMyProp.</p></header><section class="ann-grid" id="announcementList" aria-live="polite"><div class="ann-empty">Loading announcements…</div></section></main>
  <script type="module">
    import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { collection, getDocs, getFirestore } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";
    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const list = document.getElementById("announcementList");
    const esc = (value) => { const node = document.createElement("span"); node.textContent = String(value || ""); return node.innerHTML; };
    try {
      const snapshot = await getDocs(collection(getFirestore(app), "announcements"));
      const rows = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })).sort((a,b) => (b.updatedAt?.seconds || b.createdAt?.seconds || 0) - (a.updatedAt?.seconds || a.createdAt?.seconds || 0));
      list.innerHTML = rows.length ? rows.map((row) => `<article class="ann-card" id="${esc(row.id)}"><span class="ann-tag">${esc(row.tag || "Announcement")}</span><h2>${esc(row.title)}</h2><p>${esc(row.body)}</p><span class="ann-date">${esc(row.dateLabel || "Latest update")}</span></article>`).join("") : '<div class="ann-empty">No announcements are published yet.</div>';
    } catch { list.innerHTML = '<div class="ann-empty">Announcements are temporarily unavailable. Please try again shortly.</div>'; }
  </script>
  <script type="module" src="/rmp-nav.js"></script><script type="module" src="/site-auth-header.js"></script><script type="module" src="/site-performance.js"></script>
</body>
</html>
