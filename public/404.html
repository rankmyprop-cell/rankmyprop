<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#05050b">
  <title>Page Not Found | Rank My Prop</title>
  <link rel="icon" type="image/png" href="/favicon-192x192.png">
  <script defer src="/home-shell.js"></script>
  <style>
    :root{color-scheme:dark;font-family:"DM Sans",Arial,sans-serif;background:#05050b;color:#f7f5ff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,rgba(114,84,255,.2),transparent 31rem),#05050b}
    .not-found{min-height:68vh;display:grid;place-items:center;padding:110px 22px 64px;position:relative;overflow:hidden}
    .not-found:before,.not-found:after{content:"";position:absolute;border-radius:999px;filter:blur(4px);pointer-events:none}.not-found:before{width:440px;height:440px;left:-220px;bottom:-170px;background:rgba(108,76,255,.18)}.not-found:after{width:360px;height:360px;right:-160px;top:80px;background:rgba(130,91,255,.13)}
    .not-found-card{width:min(700px,100%);position:relative;text-align:center;padding:54px 36px 38px;border:1px solid rgba(143,121,255,.32);border-radius:28px;background:linear-gradient(145deg,rgba(25,21,43,.92),rgba(11,11,22,.9));box-shadow:0 26px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}
    .code{margin:0;font-size:clamp(76px,14vw,138px);line-height:.9;font-weight:800;letter-spacing:-.09em;background:linear-gradient(110deg,#fff 5%,#bca9ff 42%,#714dff 88%);-webkit-background-clip:text;background-clip:text;color:transparent}.eyebrow{display:inline-flex;margin:22px 0 12px;padding:7px 11px;border:1px solid rgba(147,121,255,.38);border-radius:999px;color:#bbaaff;background:rgba(120,91,255,.1);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.not-found h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:-.055em}.not-found p{max-width:510px;margin:14px auto 28px;color:#ada8c2;line-height:1.65;font-size:15px}.not-found-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.not-found-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:0 17px;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#e9e5ff;background:rgba(255,255,255,.045);font-weight:700;font-size:14px;transition:.18s}.not-found-actions a:hover{transform:translateY(-2px);border-color:#8b6cff;background:rgba(126,96,255,.16)}.not-found-actions .primary{border-color:#8366ff;background:linear-gradient(135deg,#8a6cff,#6045ec);box-shadow:0 12px 24px rgba(104,72,255,.26)}.explore{margin-top:31px;padding-top:25px;border-top:1px solid rgba(255,255,255,.09)}.explore span{display:block;margin-bottom:12px;color:#9992af;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}.explore-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.explore-links a{padding:9px 12px;border-radius:10px;color:#cfc7ed;background:rgba(255,255,255,.035);font-size:13px}.explore-links a:hover{background:rgba(123,95,255,.16);color:#fff}@media(max-width:560px){.not-found{padding-top:92px}.not-found-card{padding:42px 20px 28px;border-radius:22px}.not-found-actions a{width:100%}}
  </style>
<link id="rmpHomeHeaderStyles" rel="stylesheet" href="/home-header-shell.css">
<link id="rmpHomeFooterStyles" rel="stylesheet" href="/home-footer-shell.css">
<link id="rmpSiteTypographyStyles" rel="stylesheet" href="/site-typography.css">
<link rel="stylesheet" href="/site-heading-theme.css" data-rmp-heading-theme="1">
<link rel="stylesheet" href="/global-footer.css" data-rmp-global-footer-css="1">
</head>
<body>
  <main class="not-found" id="mainContent">
    <section class="not-found-card" aria-labelledby="notFoundTitle">
      <p class="code">404</p>
      <span class="eyebrow">Page not found</span>
      <h1 id="notFoundTitle">This page does not exist.</h1>
      <p>The link may have changed, or the page may no longer be available. Explore trusted prop firm research instead.</p>
      <div class="not-found-actions"><a class="primary" href="/">Back to home</a><a href="/listedprop">Browse prop firms</a></div>
      <div class="explore"><span>Continue exploring</span><div class="explore-links"><a href="/prop-firm-rules">Trading Rules</a><a href="/offers">Offers &amp; Discounts</a><a href="/reviews">Trader Reviews</a><a href="/compare">Compare Firms</a></div></div>
    </section>
  </main>
</body>
</html>
