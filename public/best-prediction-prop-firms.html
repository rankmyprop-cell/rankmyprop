  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #05040b;
      color: #fff;
    }
    .container {
      max-width: 1460px;
      margin: 60px auto;
      padding: 0 24px;
    }
    .heading {
      text-align: center;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    .heading .white {
      background: linear-gradient(90deg, #ffffff, #cfd3de);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .heading .purple {
      background: linear-gradient(90deg, #7a74ff, #b9b6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 36px;
      color: #bdb8d9;
      font-size: 15px;
      line-height: 1.6;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .search {
      width: 220px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      outline: none;
      font-size: 13px;
    }
    .filter {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      outline: none;
      font-size: 13px;
      cursor: pointer;
    }
    .filter option {
      background: #0f0e1a;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; gap: 16px; }
      .controls { flex-direction: column; width: 100%; }
      .search, .filter { width: 100% !important; box-sizing: border-box; }
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 48px;
    }
    .page-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .page-btn.active, .page-btn:hover {
      background: #7a74ff;
      border-color: #7a74ff;
    }
    .pf-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 24px;
      background: #13131f;
      border: 1px solid #2a2a3d;
      border-radius: 16px;
      color: #bdb8d9;
      font-size: 15px;
    }

    /* FIRM CARD UI */
    .pf-card{background:#13131f;border:1px solid #2a2a3d;border-radius:16px;padding:22px;width:100%;box-shadow:0 18px 36px rgba(0,0,0,.45);transition:transform .2s ease, box-shadow .2s ease}
    .pf-card:hover{transform:translateY(-3px);box-shadow:0 24px 52px rgba(93,76,245,.28)}
    .pf-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
    .pf-header-left{display:flex;align-items:flex-start;gap:12px;min-width:0}
    .pf-logo{width:54px;height:54px;border-radius:12px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,.08);font-weight:700;color:#fff;font-size:16px}
    .pf-logo img{width:100%;height:100%;object-fit:cover}
    .pf-title-wrap{min-width:0}
    .pf-firm-name-row{display:flex;align-items:center;gap:6px}
    .pf-firm-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px}
    .pf-tick-wrap{position:relative;display:inline-flex;align-items:center}
    .pf-tick{width:18px;height:18px;border-radius:50%;background:#6c47ff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(108,71,255,.45)}
    .pf-tick svg{width:10px;height:10px}
    .pf-tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1e1e30;border:1px solid #3d3d5c;border-radius:8px;padding:7px 11px;white-space:nowrap;font-size:11.5px;font-weight:500;color:#a78bfa;opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:30;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    .pf-tooltip .dot{width:7px;height:7px;background:#22c55e;border-radius:50%}
    .pf-tick-wrap:hover .pf-tooltip{opacity:1}
    .pf-rating-row{display:flex;align-items:center;gap:5px;margin-top:3px}
    .pf-rating-num{font-size:13px;font-weight:600;color:#f59e0b}
    .pf-stars{display:flex;gap:1px}
    .pf-star{color:#f59e0b;font-size:12px;line-height:1}
    .pf-star.off{color:#2a2a3d}
    .pf-reviews{font-size:12px;color:#6b7280}
    .pf-badges{display:flex;gap:7px;margin-bottom:12px}
    .pf-badge{padding:4px 11px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.4px}
    .pf-badge-verified{background:#14532d;color:#4ade80}
    .pf-badge-market{background:#1c1c2e;border:1px solid #3d3d5c;color:#9ca3af}
    .pf-tagline{font-size:13.5px;color:#9ca3af;margin-bottom:14px;min-height:40px}
    .pf-divider{height:1px;background:#1e1e30;margin-bottom:14px}
    .pf-stats-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .pf-stat-item{display:flex;align-items:center;gap:8px;min-width:0}
    .pf-stat-icon{width:32px;height:32px;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#7c3aed;flex-shrink:0}
    .pf-stat-icon svg{width:15px;height:15px}
    .pf-stat-val{font-size:14px;font-weight:700;color:#fff;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
    .pf-stat-label{font-size:9.5px;color:#6b7280;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
    .pf-stat-sep{width:1px;height:30px;background:#1e1e30}
    .pf-details-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 6px;margin-bottom:14px}
    .pf-detail-row{display:flex;align-items:center;gap:6px;min-width:0}
    .pf-detail-icon{width:22px;height:22px;background:#1a1a2e;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#6c47ff;flex-shrink:0}
    .pf-detail-icon svg{width:11px;height:11px}
    .pf-detail-label{font-size:11px;color:#6b7280;white-space:nowrap}
    .pf-detail-val{font-size:11.5px;font-weight:600;color:#fff;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
    .pf-btn-row{display:flex;gap:10px;margin-top:2px}
    .pf-btn{flex:1;padding:11px 0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .12s;text-decoration:none;display:flex;align-items:center;justify-content:center;color:#fff}
    .pf-btn:hover{opacity:.85;transform:translateY(-1px)}
    .pf-btn-outline{background:transparent;border:1px solid #2a2a3d}
    .pf-btn-primary{background:#5b40f5;gap:6px}
    @media(max-width:640px){.pf-details-grid{grid-template-columns:1fr}.pf-stat-val{max-width:74px}}
  </style>
</head>
